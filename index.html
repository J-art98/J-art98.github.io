<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannik Reisen 🌍✈️</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js für die Graphen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
            cursor: pointer;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1:hover {
            color: var(--accent-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .badge {
            background: #334155;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            box-sizing: border-box;
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Admin Banner */
        .admin-banner {
            background: linear-gradient(135deg, #1e3a8a, #1e293b);
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .admin-banner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #93c5fd;
            font-weight: bold;
        }

        /* Chat Styles */
        .chat-box-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-messages-list {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            height: 180px;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.9rem;
        }
        .chat-msg {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .chat-msg-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }

        /* Post & Poll Creator Styles */
        .post-creation-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
        }
        .form-group input[type="text"],
        .form-group textarea,
        .poll-option-input,
        .form-row select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .poll-creator-section {
            background: #0f172a;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .poll-creator-section h3 {
            margin-top: 0;
            font-size: 0.95rem;
            margin-bottom: 4px;
            border-bottom: none;
            padding-bottom: 0;
        }
        .hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 10px;
        }
        .poll-option-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .btn-secondary {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .section-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 4px 0;
        }
        .additional-features-section h4 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--text-color);
        }
        .form-row {
            margin-bottom: 10px;
        }
        .form-row label {
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-row input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Poll Styles */
        .poll-option {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
        }
        .poll-option:hover {
            border-color: var(--accent-color);
            background: #1e293b;
        }
        .poll-bar {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            background: rgba(59, 130, 246, 0.2);
            z-index: 1;
            transition: width 0.3s ease;
        }
        .poll-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .map-wrapper {
            position: relative;
        }

        .map-container {
            height: 320px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            z-index: 1;
        }

        .map-legend-container {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 1000;
        }

        .legend-toggle-btn {
            background: rgba(30, 41, 59, 0.95);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-toggle-btn:hover {
            background: rgba(51, 65, 85, 0.95);
        }

        .map-legend {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .map-legend label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .legend-dot.red { background: #ef4444; }
        .legend-dot.blue { background: #3b82f6; }
        .legend-dot.orange { background: #f59e0b; }
        .legend-dot.green { background: #10b981; }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .radius-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .radius-control input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        select {
            cursor: pointer;
        }

        .section-header-bar {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            gap: 8px;
        }

        .section-header-bar strong {
            font-size: 1rem;
            white-space: nowrap;
        }

        .inline-filter {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .inline-filter label {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .inline-filter select {
            padding: 3px 6px;
            font-size: 0.8rem;
            width: auto;
            max-width: 140px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: white;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .weather-day {
            background: #0f172a;
            padding: 10px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: center;
        }

        .weather-day:hover {
            border-color: var(--accent-color);
            background: #1e293b;
        }

        .weather-hours {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 6px;
            margin-top: 10px;
        }

        .hour-slot {
            background: #0f172a;
            min-width: 60px;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .hour-slot:hover {
            border-color: var(--accent-color);
            background: #1e293b;
        }

        .day-divider {
            background: #020617;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            min-width: 85px;
            padding: 8px 4px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            gap: 2px;
        }

        .clickable {
            color: #60a5fa;
            cursor: pointer;
            text-decoration: underline;
        }

        .clickable:hover {
            color: #93c5fd;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0 0;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .item-row:hover {
            background: #1e293b;
        }

        .item-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex-grow: 1;
        }

        .item-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            background: #334155;
            flex-shrink: 0;
        }

        .item-text-details {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: #334155;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #fbbf24;
            flex-shrink: 0;
        }

        .load-more-btn {
            background: #334155;
            color: white;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            font-size: 0.85rem;
        }

        .load-more-btn:hover {
            background: #475569;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            max-width: 800px;
            width: 95%;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .fullscreen-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 16px;
        }

        .fullscreen-content-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 780px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            overflow: hidden;
        }

        .fullscreen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121824;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .fullscreen-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .close-modal {
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-muted);
            background: #334155;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .close-modal:hover {
            background: #475569;
            color: white;
        }
        
        .gallery-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .gallery-img {
            height: 140px;
            border-radius: 6px;
            object-fit: cover;
            background: #000;
            flex-shrink: 0;
            width: 180px;
        }

        .nav-button-container {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
        }

        .navigate-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            text-decoration: none;
        }

        .navigate-btn:hover {
            background: #059669;
        }

        .loading-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s
